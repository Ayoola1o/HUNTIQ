[build]
  command = "pnpm --filter @workspace/huntiq run build"
  publish = "artifacts/huntiq/dist/public"

[build.environment]
  NODE_ENV = "production"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,PORT,VITE_GEOAPIFY_API_KEY,VITE_GOOGLE_MAPS_API_KEY,API_KEY,DATABASE_URL,JWT_SECRET"
  SECRETS_SCAN_OMIT_PATHS = ".migration-backup/**,docs/**"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
