[build]
  command = "pnpm --filter @workspace/huntiq run build"
  publish = "artifacts/huntiq/dist/public"

[build.environment]
  NODE_ENV = "production"
  SECRETS_SCAN_ENABLED = "true"
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,PORT"
  SECRETS_SCAN_OMIT_PATHS = ".migration-backup/**,docs/**"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
